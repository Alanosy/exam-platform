# ruoyi-exam-ai 服务配置
# =================================================

spring:
  datasource:
    dynamic:
      # AI 服务以查询为主（题库 / 试卷 / 答卷快照），归 exam 主库
      primary: master
      datasource:
        master:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.exam.url}
          username: ${datasource.exam.username}
          password: ${datasource.exam.password}

# Agent 回调工具端点（/api/exam-tool/**）的共享令牌
# 这些端点不经过网关（Python agent 直连 9220），所以 @SaIgnore 掉登录校验，
# 内网通行证（SA-SAME-TOKEN）由 ExamToolSameTokenConfig 自动补，
# 真正的把关是这个共享令牌。留空表示不校验（本地联调用）；
# 上生产要配成与 agent 的 AGENT_JAVA_GATEWAY_TOKEN 一致的值。
exam-tool:
  token: ""
  # AI 代调业务接口时打到哪个网关（走网关才能带上用户的登录态与权限）
  gateway-url: http://127.0.0.1:8080
  api:
    # 总开关：关掉后 Agent 只能用内置工具，不能代调任意接口
    enabled: true
    timeout-ms: 8000
    # 允许代调的路径前缀（只列考试域业务接口；用户/租户/菜单/监控/代码生成一律不在内）
    allow: /exam/,/invite/,/question/,/paper/,/answer/,/mark/,/stat/,/practice/,/proctor/,/cert/,/system/dict/
    # 显式拒绝，优先级高于 allow
    deny: /exam/user/,/system/dict/type/
    # 非 GET 请求还必须命中这些前缀（写操作二次收口）
    # 只放开「真的需要 AI 代劳」的那几个写接口，其余一律不放：
    # 删考试 / 删试题 / 改用户这类破坏性操作永远不在名单里
    write-allow: /question/create,/mark/score,/mark/task/,/cert/record/,/practice/wrong/,/exam/

# 兜底方案：若上述通行证桥接在你的环境里不生效（例如 Redis 里没有 same-token，
# 启动时日志会报「读取内网 same-token 失败」），可直接关掉本服务的内网调用鉴权。
# 只影响 exam-ai 这一个服务，其它服务仍必须经网关访问。
# sa-token:
#   check-same-token: false

# AI Agent（Python FastAPI）服务发现配置
ai:
  agent:
    # 服务名（与 Nacos 注册一致，禁止修改）
    service-name: ruoyi-exam-agent
    # 走服务发现 lb://ruoyi-exam-agent 时使用的 REST 基路径
    base-path: /
    # 单次请求超时（毫秒）
    connect-timeout: 5000
    read-timeout: 60000
    # 重试
    max-retries: 2
    # 异步批量场景走 RocketMQ（先留接口，启用 MQ 后填）
    mq:
      enabled: false
      topic: ai-agent-task
      consumer-group: ruoyi-exam-ai-consumer
