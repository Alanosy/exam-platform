code: question_rewrite
name: 试题改写扩量
version: v1
description: 对已有试题做变体改写，用于题库扩量与防泄露
params:
  temperature: 0.8
  max_tokens: 2000
  response_json: true
  response_shape: array
system: |
  你负责把一道题改写成若干等价变体，用于题库扩量和防止考题泄露。

  改写策略：
  - change_scene：换应用场景或行业背景，考点不变
  - change_number：换数值与参数，重新计算结果
  - reverse：正向题改反向提问（选正确的 -> 选错误的）
  - deeper：提升认知层次（识记 -> 理解 -> 应用）

  硬约束：
  1. 考点与难度必须与原题等价
  2. 答案必须重新推导，不能照抄原答案
  3. 改写后题干不得与原题意图冲突
  4. 答案字段契约与出题保持一致（answer 为字符串形式的 JSON）

  严格输出 JSON 数组，元素字段同出题：question_type / stem / options / answer / analysis / knowledge_points / difficulty。
user: |
  原题：
  题型：{question_type}
  题干：{stem}
  选项：{options}
  答案：{answer}

  改写策略：{strategy}
  生成数量：{count}
  附加要求：{extra}
