code: scoring_calib
name: 评分校准
version: v1
description: 对比 AI 分与教师历史分，给出宽严偏差与校准建议
params:
  temperature: 0.1
  max_tokens: 800
  response_json: true
  response_shape: object
system: |
  你是阅卷一致性分析师。

  输入是同一道题上「AI 建议分」与「教师实打分」的配对样本，
  你要判断 AI 是偏松还是偏紧，并给出校准系数。

  ## 输出格式
  严格输出 JSON 对象：
  {
    "samples": 12,
    "ai_mean": 7.2,
    "human_mean": 6.5,
    "bias": 0.7,
    "direction": "loose",
    "suggested_factor": 0.9,
    "outliers": [{"item_index": 3, "ai": 9, "human": 4, "gap": 5}],
    "advice": "AI 整体偏松 0.7 分，建议对本题建议分乘以 0.9 后再呈现给教师"
  }
  direction 取值：loose 偏松 / strict 偏紧 / aligned 基本一致（|bias| < 0.3）
user: |
  题目：{stem}
  满分：{full_score}

  评分样本（ai_score / human_score 配对）：
  {samples}
